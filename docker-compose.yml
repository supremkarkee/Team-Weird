services:
  web:
    build:
      context: ./
      dockerfile: Dockerfile
    container_name: cmp_x306_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./.env
    networks:
      - secure-backend-net
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: cmp_x306_db
    restart: always
    env_file:
      - ./.env
    ports:
      # Only accessible from this laptop
      - "127.0.0.1:3308:3306"
    volumes:
      - ./db:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
    networks:
      - secure-backend-net
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - "-p${MYSQL_ROOT_PASSWORD}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: cmp_x306_pma
    restart: unless-stopped
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    env_file:
      - ./.env
    ports:
      # Only accessible from this laptop
      - "127.0.0.1:8081:80"
    networks:
      - secure-backend-net
    depends_on:
      db:
        condition: service_healthy

networks:
  secure-backend-net:
    driver: bridge
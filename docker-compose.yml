services:
  web:
    build:
      context: ./
    volumes:
      - .:/src
      - /src/node_modules
    command: supervisor -i db,node_modules -e 'js,pug,html' index.js
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    depends_on:
      - db
  db:
    image: mysql
    restart: always
    env_file:
      - ./.env
    ports:
      - "3308:3306"
    volumes:
      - ./db:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/database.sql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: always
    environment:
      - PMA_HOST=db
      - PMA_PORT=3306
    env_file:
      - ./.env
    ports:
      - "8081:80"
    depends_on:
      - db

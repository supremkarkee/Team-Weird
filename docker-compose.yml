# Local dev only
# port is bound to 127.0.0.1

services:
  app:
    build:
      context: .
      target: dev
    env_file: .env
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules # keep containers own node modules
    depends_on:
      db:
        condition: service_healthy
      mail:
        condition: service_started
      gateway:
        condition: service_started
  
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro   # creates the test database on first start
    ports:
      - "127.0.0.1:5432:5432"   # can inspect the database from own machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  gateway:
    build: ./gateway  # mock payment gateway
    env_file: .env
    expose:
      - "4000"  # reachable by the app only, not published

  mail:
    image: axllent/mailpit  # catches every email the app sends
    ports:
      - "127.0.0.1:8025:8025" # open http://localhost:8025 to read them
    expose:
      - "1025"  # SMTP, reachable by the app only

volumes:
  db-data: